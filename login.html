<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>로그인 | 시니어 나침반</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--paper:#F7F9FB;--ink:#22303A;--soft:#5C7080;--teal:#2D6FA3;--deep:#1B4A70;--ochre:#E8873D;--line:#DCE4E8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.6}header{padding:22px;background:var(--deep)}header a{color:#fff;font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;text-decoration:none}.page{width:min(100% - 40px,520px);margin:58px auto}.card{padding:34px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 12px 28px rgba(27,74,112,.09)}h1{margin:0 0 8px;font-family:'Noto Serif KR',serif;color:var(--deep);font-size:34px}.lead{margin:0 0 26px;color:var(--soft)}label{display:block;margin:15px 0 6px;font-weight:700}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:9px;background:var(--ochre);color:#fff;font:700 16px inherit;cursor:pointer}.secondary{margin-top:10px;background:transparent;color:var(--teal);font-size:14px}.message{min-height:24px;margin:16px 0 0;color:#A22D23;font-size:14px}.message.ok{color:#26724A}.bottom{margin:22px 0 0;text-align:center;color:var(--soft)}a{color:var(--teal)}#resetPanel[hidden]{display:none}</style></head><body><header><a href="index.html">시니어 나침반</a></header><main class="page"><section class="card"><h1>로그인</h1><p class="lead">회원 전용 기능을 이용하려면 로그인하세요.</p><form id="loginForm"><label for="email">이메일</label><input id="email" type="email" required autocomplete="email"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">로그인</button></form><button id="showReset" class="secondary" type="button">비밀번호를 잊으셨나요?</button><div id="resetPanel" hidden><label for="resetEmail">재설정 이메일</label><input id="resetEmail" type="email" autocomplete="email"><button id="resetBtn" class="secondary" type="button">재설정 이메일 보내기</button></div><p id="message" class="message" aria-live="polite"></p><p class="bottom">계정이 없으신가요? <a id="signupLink" href="signup.html">회원가입</a></p></section></main><script type="module">import {auth,safeReturnUrl} from './assets/auth.js';import{signInWithEmailAndPassword,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';const params=new URLSearchParams(location.search),returnUrl=safeReturnUrl(params.get('return')),message=document.getElementById('message');document.getElementById('signupLink').href='signup.html?return='+encodeURIComponent(returnUrl);const errors={'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않습니다.','auth/user-not-found':'이메일 또는 비밀번호가 올바르지 않습니다.','auth/wrong-password':'이메일 또는 비밀번호가 올바르지 않습니다.','auth/invalid-email':'이메일 주소를 확인해주세요.','auth/network-request-failed':'네트워크 상태를 확인해주세요.'};document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();message.textContent='';try{await signInWithEmailAndPassword(auth,email.value.trim(),password.value);location.href=returnUrl}catch(error){message.textContent=errors[error.code]||'로그인에 실패했습니다.'}});document.getElementById('showReset').addEventListener('click',()=>{resetPanel.hidden=false;resetEmail.value=email.value});document.getElementById('resetBtn').addEventListener('click',async()=>{message.className='message';try{await sendPasswordResetEmail(auth,resetEmail.value.trim());message.textContent='재설정 이메일을 보냈습니다. 메일함을 확인해주세요.';message.className='message ok'}catch(error){message.textContent=errors[error.code]||'재설정 이메일을 보낼 수 없습니다.'}});</script></body></html>
