<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한인 운영 요양시설 소개 | 시니어 나침반</title>
<meta name="description" content="오렌지카운티·LA 카운티 한인 운영 RCFE 시설 목록과 라이선스 확인 안내">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F9FB; --paper-dim:#EAF0F5; --ink:#22303A; --ink-soft:#5C7080;
    --teal:#2D6FA3; --teal-deep:#1B4A70; --ochre:#E8873D; --ochre-soft:#FBE4CE;
    --line:#DCE4E8; --danger:#C0392B; --danger-soft:#FBEAE7; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; color:var(--ink); background:var(--paper); font-family:'Noto Sans KR',sans-serif; line-height:1.7; }
  header{ padding:42px 24px; background:var(--teal-deep); color:#fff; }
  .header-inner,.wrap{ width:min(1080px,100%); margin:0 auto; }
  .eyebrow{ margin-bottom:7px; color:#CFE3F2; font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; }
  h1,h2{ font-family:'Noto Serif KR',serif; line-height:1.4; }
  h1{ margin:0 0 8px; font-size:clamp(34px,5vw,48px); }
  .sub{ margin:0; color:#E7F0F6; font-size:17px; }
  .nav{ display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; }
  .nav a{ padding:8px 13px; border:1px solid rgba(255,255,255,.45); border-radius:8px; color:#fff; font-size:14px; font-weight:700; text-decoration:none; }
  .nav a.primary{ border-color:var(--ochre); background:var(--ochre); }
  .wrap{ padding:38px 24px 70px; }
  .notice{ margin:0 0 30px; padding:20px 22px; border-left:6px solid var(--ochre); border-radius:12px; background:var(--ochre-soft); font-size:16px; }
  .member-actions{ display:flex; flex-wrap:wrap; gap:9px; margin:0 0 18px; }
  .member-action{ padding:9px 13px; border:0; border-radius:8px; background:var(--teal); color:#fff; font:800 14px inherit; cursor:pointer; }
  .list-status{ margin:0 0 16px; color:var(--ink-soft); font-size:14px; }
  .facility-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .facility-card{ overflow:hidden; border:1px solid var(--line); border-radius:15px; background:var(--card); box-shadow:0 9px 24px rgba(27,74,112,.07); }
  .photo-wrap{ height:210px; display:grid; place-items:center; background:#E2E7EA; color:var(--ink-soft); font-weight:700; }
  .photo-wrap img{ width:100%; height:100%; display:block; object-fit:cover; }
  .photo-wrap img[hidden]{ display:none; }
  .card-body{ padding:22px; }
  .facility-card h2{ margin:0; color:var(--teal-deep); font-size:23px; }
  .name-ko{ margin:2px 0 13px; color:var(--ink-soft); font-size:15px; }
  .address{ margin:0 0 14px; font-size:15px; }
  .badges{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 15px; }
  .badge{ padding:5px 9px; border-radius:999px; background:var(--paper-dim); color:var(--teal-deep); font-size:13px; font-weight:800; }
  .badge.warning{ background:var(--danger-soft); color:var(--danger); }
  .intro{ min-height:52px; margin:0 0 17px; color:var(--ink-soft); font-size:15px; }
  .intro.pending{ font-style:italic; }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; }
  .btn{ display:inline-flex; padding:9px 12px; border-radius:8px; background:var(--teal); color:#fff; font-size:14px; font-weight:800; text-decoration:none; }
  .btn.verify{ background:var(--ochre); }
  .empty{ grid-column:1/-1; padding:42px; border:1px dashed var(--line); border-radius:14px; color:var(--ink-soft); text-align:center; }
  footer{ padding:28px 24px; background:var(--teal-deep); color:#D7E8F4; }
  .footer-inner{ width:min(1080px,100%); margin:0 auto; display:flex; justify-content:space-between; gap:20px; }
  .brand{ color:#fff; font-family:'Noto Serif KR',serif; font-size:19px; font-weight:700; }
  @media(max-width:850px){ .facility-grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:580px){ .facility-grid{ grid-template-columns:1fr; } .footer-inner{ flex-direction:column; } }
  @media print{ header,.notice,.member-actions,.list-status,footer,.actions{ display:none !important; } body{ background:#fff; } .wrap{ width:100%; padding:0; } .facility-grid{ grid-template-columns:repeat(2,1fr); } .facility-card{ break-inside:avoid; box-shadow:none; } }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="eyebrow">시니어 나침반 · 장기요양 안내</div>
    <h1>한인 운영 시설 소개</h1>
    <p class="sub">확인된 시설 정보를 차례로 정리해 소개합니다</p>
    <nav class="nav" aria-label="주요 메뉴">
      <a href="index.html">🏠 홈</a>
      <a href="map.html">🗺️ 아파트 지도</a>
      <a href="guide.html">📋 주택 신청 안내</a>
      <a class="primary" href="ltc-guide.html">🧭 입소 절차</a>
      <a href="community.html">🗞 커뮤니티</a>
      <a href="ihss-guide.html">🧑‍⚕️ IHSS 케어기버</a>
      <a href="contact.html">✉ 문의하기</a>
      <span data-auth-ui></span>
    </nav>
  </div>
</header>

<main class="wrap">
  <p class="notice">아래 목록은 한인 커뮤니티에서 운영하는 시설을 소개하며, 시설 소개는 운영진이 직접 작성한 내용입니다. 정확한 정보와 최신 이용 가능 여부는 시설에 직접 문의하시기 바랍니다.</p>
  <div class="member-actions"><button class="member-action" id="emailResultsBtn" type="button">📧 이 목록 이메일로 받기</button><button class="member-action" id="printResultsBtn" type="button">🖨️ 인쇄하기</button></div>
  <p class="list-status" id="listStatus" aria-live="polite">시설 정보를 불러오는 중입니다.</p>
  <div class="facility-grid" id="facilityGrid"></div>
</main>

<footer>
  <div class="footer-inner"><div class="brand">시니어 나침반</div><div>시설 정보는 라이선스 확인 후 게시합니다</div></div>
</footer>

<script src="assets/common.js"></script>
<script>
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>'"]/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
  })[char]);
}

function facilityCard(facility){
  const name = facility.name || facility.nameKorean || '시설명 준비 중';
  const koreanName = facility.name && facility.nameKorean ? `<p class="name-ko">${escapeHtml(facility.nameKorean)}</p>` : '';
  const address = facility.fullAddress || [facility.address, facility.city, facility.zip].filter(Boolean).join(', ');
  const addressHtml = address ? `<p class="address">📍 ${escapeHtml(address)}</p>` : '';
  const phoneHtml = facility.phone ? `<a class="btn" href="${callHref(facility.phone)}">📞 ${escapeHtml(facility.phone)}</a>` : '';
  const licenseHtml = facility.licenseNumber
    ? `<span class="badge">면허번호: ${escapeHtml(facility.licenseNumber)}</span>`
    : '<span class="badge warning">면허정보 확인 필요</span>';
  const verifyHtml = facility.licenseVerifyUrl
    ? `<a class="btn verify" href="${escapeHtml(facility.licenseVerifyUrl)}" target="_blank" rel="noopener">면허 확인하기</a>`
    : '';
  const intro = facility.intro
    ? `<p class="intro">${escapeHtml(facility.intro)}</p>`
    : '<p class="intro pending">소개 준비 중입니다</p>';
  const photo = facility.photo
    ? `<img src="${escapeHtml(facility.photo)}" alt="${escapeHtml(name)} 시설 사진" loading="lazy">`
    : '';

  return `<article class="facility-card">
    <div class="photo-wrap">${photo}<span${photo ? ' hidden' : ''}>사진 준비 중</span></div>
    <div class="card-body">
      <h2>${escapeHtml(name)}</h2>${koreanName}${addressHtml}
      <div class="badges"><span class="badge">${escapeHtml(facility.licenseType || 'RCFE')}</span>${licenseHtml}</div>
      ${intro}<div class="actions">${phoneHtml}${verifyHtml}</div>
    </div>
  </article>`;
}

async function loadLtcFacilities(){
  const grid = document.getElementById('facilityGrid');
  const status = document.getElementById('listStatus');
  try{
    const response = await fetch('data/ltc-facilities.json');
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const facilities = await response.json();
    grid.innerHTML = facilities.length ? facilities.map(facilityCard).join('') : '<div class="empty">등록된 시설이 없습니다.</div>';
    grid.querySelectorAll('.photo-wrap img').forEach(img => {
      img.addEventListener('error', () => {
        img.hidden = true;
        const fallback = img.nextElementSibling;
        if(fallback) fallback.hidden = false;
      }, { once:true });
    });
    status.textContent = `시설 ${facilities.length}건`;
  }catch(error){
    grid.innerHTML = '<div class="empty">시설 정보를 불러오지 못했습니다. 잠시 후 다시 확인해주세요.</div>';
    status.textContent = '시설 정보 로드 실패';
  }
}

loadLtcFacilities();
</script>
<script type="module">
import { MEMBER_API, requireMemberOrRedirect, getIdToken } from './assets/auth.js';
function resultsHtml(){ return `<h1>시니어 나침반 - 시설 검색 결과</h1>${[...document.querySelectorAll('.facility-card')].map(card=>card.outerHTML).join('') || '<p>표시할 시설이 없습니다.</p>'}`; }
document.getElementById('printResultsBtn').addEventListener('click',async()=>{ if(await requireMemberOrRedirect(window.location.href)) window.print(); });
document.getElementById('emailResultsBtn').addEventListener('click',async()=>{
  if(!await requireMemberOrRedirect(window.location.href)) return;
  if(!MEMBER_API){ alert('이메일 발송 기능이 아직 준비 중입니다'); return; }
  try{ const response=await fetch(MEMBER_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:await getIdToken(),resultsHtml:resultsHtml()})}); const result=await response.json(); alert(result && result.ok ? '검색 결과를 이메일로 보냈습니다.' : (result.error || '이메일 발송에 실패했습니다.')); }catch(_){ alert('이메일 발송에 실패했습니다. 잠시 후 다시 시도해주세요.'); }
});
</script>
</body>
</html>
