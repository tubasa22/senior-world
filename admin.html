<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 게시 | 시니어 나침반</title><link rel="icon" href="assets/img/favicon.svg"><style>body{margin:0;
background:#F7F9FB;
color:#22303A;
font:16px/1.7 system-ui}.wrap{width:min(720px,100%);
margin:auto;
padding:36px 24px}header{background:#1B4A70}header a{color:#fff;
font-weight:bold;
text-decoration:none}.card{padding:24px;
border:1px solid #DCE4E8;
border-radius:12px;
background:#fff}label{display:block;
margin-top:14px;
font-weight:bold}input,textarea{box-sizing:border-box;
width:100%;
padding:10px;
border:1px solid #DCE4E8;
border-radius:7px;
font:inherit}textarea{min-height:160px}button{margin-top:18px;
padding:12px 18px;
border:0;
border-radius:8px;
background:#E8873D;
color:#fff;
font-weight:bold}.hidden{display:none}.message{color:#A22}a{color:#2D6FA3}</style></head><body><header><div class="wrap"><a href="index.html">시니어 나침반</a></div></header><main class="wrap"><h1>커뮤니티 게시</h1><section id="loginNotice" class="card hidden">관리자 로그인이 필요합니다. <a href="login.html?return=admin.html">로그인하기</a></section><form id="postForm" class="card hidden"><label><input type="radio" name="postType" value="공지" checked> 공지 <input type="radio" name="postType" value="뉴스"> 뉴스</label><label>제목<input id="postTitle" required maxlength="200"></label><label>본문<textarea id="postBody" required maxlength="5000"></textarea></label><div id="sourceFields" class="hidden"><label>출처 언론사명<input id="sourceName" maxlength="100"></label><label>출처 링크<input id="sourceUrl" type="url" maxlength="1000"></label></div><button>게시하기</button><p id="message" class="message"></p><a id="communityLink" class="hidden" href="community.html">커뮤니티로 이동</a></form><p>이 화면은 관리자 전용입니다. 뉴스를 게시할 때는 원문을 그대로 복사하지 말고, 자기 말로 재구성한 내용만 입력하세요.</p></main><script type="module">import{authReady,currentUser,getIdToken}from'./assets/auth.js';
const COMMUNITY_API='https://script.google.com/macros/s/AKfycbxpFfpCazh15auxmUgqh18bxArDoTqNifHMehkQ8jKqGCOHeoG5uxFdxlk2-e1baZ2K/exec';
const form=document.querySelector('#postForm'),notice=document.querySelector('#loginNotice'),message=document.querySelector('#message'),sourceFields=document.querySelector('#sourceFields');
await authReady;
if(currentUser)form.classList.remove('hidden');
else notice.classList.remove('hidden');
document.querySelectorAll('[name=postType]').forEach(r=>r.onchange=()=>sourceFields.classList.toggle('hidden',document.querySelector('[name=postType]:checked').value!=='뉴스'));
form.onsubmit=async e=>{e.preventDefault();
if(!COMMUNITY_API){message.textContent='게시 기능이 아직 준비 중입니다.';
return}const payload={action:'createPost',idToken:await getIdToken(),postType:document.querySelector('[name=postType]:checked').value,title:document.querySelector('#postTitle').value,body:document.querySelector('#postBody').value,sourceName:document.querySelector('#sourceName').value,sourceUrl:document.querySelector('#sourceUrl').value};
try{const res=await fetch(COMMUNITY_API,{method:'POST',headers:{'Content-Type':'text/plain;
charset=utf-8'},body:JSON.stringify(payload)}),out=await res.json();
if(!out.ok)throw new Error(out.error);
message.textContent='게시되었습니다.';
form.reset();
sourceFields.classList.add('hidden');
document.querySelector('#communityLink').classList.remove('hidden')}catch(error){message.textContent=error.message||'게시하지 못했습니다.'}};
</script></body></html>
