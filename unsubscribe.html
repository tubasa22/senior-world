<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>뉴스레터 수신 해지 | 시니어 나침반</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--paper:#F7F9FB;--ink:#22303A;--soft:#5C7080;--teal:#2D6FA3;--deep:#1B4A70;--ochre:#E8873D;--line:#DCE4E8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.7}header{padding:22px;background:var(--deep)}header a{color:#fff;font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;text-decoration:none}.page{width:min(100% - 40px,620px);margin:58px auto}.card{padding:34px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:0 12px 28px rgba(27,74,112,.09)}h1{margin:0 0 10px;font-family:'Noto Serif KR',serif;color:var(--deep);font-size:34px}p{color:var(--soft)}button{padding:12px 18px;border:0;border-radius:9px;background:var(--ochre);color:#fff;font:700 16px inherit;cursor:pointer}button[hidden]{display:none}.message{min-height:24px;margin:18px 0 0;font-size:14px}.ok{color:#26724A}.error{color:#A22D23}</style></head><body><header><a href="index.html">시니어 나침반</a></header><main class="page"><section class="card"><h1>뉴스레터 수신 해지</h1><p id="description">뉴스레터 수신 동의를 철회하려면 로그인해 주세요. 수신 해지 후에도 회원 계정과 주거 정보 이용은 계속 가능합니다.</p><button id="loginBtn" type="button">로그인하고 수신 해지하기</button><button id="unsubscribeBtn" type="button" hidden>뉴스레터 수신 해지</button><p id="message" class="message" aria-live="polite"></p></section></main><script type="module">import{auth,db,authReady,currentUser}from'./assets/auth.js';import{doc,updateDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';const loginBtn=document.getElementById('loginBtn'),unsubscribeBtn=document.getElementById('unsubscribeBtn'),message=document.getElementById('message'),description=document.getElementById('description');await authReady;if(currentUser){description.textContent='현재 로그인한 계정의 뉴스레터 수신 동의를 철회합니다. 회원 계정과 주거 정보 이용은 계속 가능합니다.';loginBtn.hidden=true;unsubscribeBtn.hidden=false}else{loginBtn.addEventListener('click',()=>location.href='login.html?return='+encodeURIComponent('unsubscribe.html'))}unsubscribeBtn.addEventListener('click',async()=>{unsubscribeBtn.disabled=true;try{await updateDoc(doc(db,'users',auth.currentUser.uid),{newsletterOptIn:false,newsletterUnsubscribedAt:serverTimestamp()});message.textContent='뉴스레터 수신이 해지되었습니다.';message.className='message ok';unsubscribeBtn.hidden=true}catch(_){message.textContent='수신 해지에 실패했습니다. 잠시 후 다시 시도해주세요.';message.className='message error';unsubscribeBtn.disabled=false}});</script></body></html>
