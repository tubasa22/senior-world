<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC 시니어 아파트 지도 | Bridge One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --paper:#F6F2E9;
    --paper-dim:#EDE7D8;
    --ink:#212B2A;
    --ink-soft:#5B6B67;
    --teal:#1C6E64;
    --teal-deep:#0F4A44;
    --ochre:#C6862E;
    --line:#D8D0BC;
    --card-bg:#FFFFFF;
    --danger:#B4472F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Noto Sans KR', sans-serif;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    background:var(--teal-deep);
    color:#F6F2E9;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    border-bottom:3px solid var(--ochre);
  }
  .brand{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;}
  .brand h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:-0.2px;
  }
  .brand .eyebrow{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#C9E4DF;
    font-weight:500;
  }
  .stats{
    display:flex;
    gap:18px;
    font-size:13px;
    color:#DDEFEC;
  }
  .stats b{ font-size:16px; color:#fff; font-family:'Noto Serif KR', serif;}

  /* ---------- Controls ---------- */
  .controls{
    background:var(--card-bg);
    border-bottom:1px solid var(--line);
    padding:10px 20px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .controls input[type="text"]{
    flex:1 1 220px;
    padding:9px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--paper);
  }
  .controls select{
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .toggle-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    padding:8px 12px;
    border:1.5px solid var(--line);
    border-radius:20px;
    cursor:pointer;
    user-select:none;
    background:var(--paper);
    white-space:nowrap;
  }
  .toggle-chip.active{
    background:var(--ochre);
    border-color:var(--ochre);
    color:#fff;
    font-weight:700;
  }
  .toggle-chip input{display:none;}

  /* ---------- Progress bar (geocoding) ---------- */
  .geo-progress{
    background:#FFF6E6;
    border-bottom:1px solid var(--line);
    padding:6px 20px;
    font-size:12.5px;
    color:#7A5A18;
    display:none;
    align-items:center;
    gap:10px;
  }
  .geo-progress.show{display:flex;}
  .geo-bar-track{
    flex:1;
    height:6px;
    background:#EEE0BE;
    border-radius:4px;
    overflow:hidden;
    max-width:240px;
  }
  .geo-bar-fill{
    height:100%;
    background:var(--ochre);
    width:0%;
    transition:width .2s ease;
  }

  /* ---------- Main split ---------- */
  .main{
    flex:1;
    display:flex;
    min-height:0;
  }
  .list-pane{
    width:420px;
    min-width:320px;
    max-width:46vw;
    background:var(--paper-dim);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:12px;
  }
  .map-pane{
    flex:1;
    position:relative;
  }
  #map{ height:100%; width:100%; }

  .result-count{
    font-size:12.5px;
    color:var(--ink-soft);
    padding:4px 6px 10px;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--card-bg);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:14px 14px 12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    position:relative;
  }
  .card:hover{
    border-color:var(--teal);
    box-shadow:0 3px 10px rgba(28,110,100,0.12);
  }
  .card.selected{
    border-color:var(--teal);
    box-shadow:0 0 0 2px var(--teal) inset;
    background:#F1F8F6;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
  }
  .card-name{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:15.5px;
    line-height:1.35;
    margin:0 0 4px;
  }
  .card-addr{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px;}
  .badge{
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge-age{ background:#DCEEEB; color:var(--teal-deep); }
  .badge-pb{ background:#F3E3C8; color:#7A5518; }
  .badge-units{ background:#EDEAE0; color:var(--ink-soft); }
  .badge-rating{ background:#FBEFD6; color:#9A6B12; }
  .badge-rating small{ font-weight:500; opacity:.8; }
  .card-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .btn{
    flex:1 1 auto;
    text-align:center;
    font-size:12px;
    font-weight:700;
    padding:8px 6px;
    border-radius:7px;
    text-decoration:none;
    border:1.5px solid transparent;
    white-space:nowrap;
  }
  .btn-call{ background:var(--teal); color:#fff; }
  .btn-call:hover{ background:var(--teal-deep); }
  .btn-web{ background:#fff; color:var(--ink); border-color:var(--line); }
  .btn-web:hover{ border-color:var(--teal); color:var(--teal-deep); }
  .btn-dir{ background:#fff; color:var(--ink); border-color:var(--line); }
  .btn-dir:hover{ border-color:var(--ochre); color:#7A5518; }
  .btn-mail{ background:#fff; color:var(--ink); border-color:var(--line); }
  .btn-review{ background:#FBEFD6; color:#9A6B12; border-color:#EAD3A0; }
  .btn-review:hover{ background:#F5E3BE; }
  .btn-disabled{ opacity:.35; pointer-events:none; }

  /* ---------- 후기 모달 ---------- */
  .modal-backdrop{
    display:none; position:fixed; inset:0; z-index:2000;
    background:rgba(15,74,68,0.45);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:440px;
    max-height:90vh; overflow-y:auto; box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .modal-head{
    background:var(--teal-deep); color:#F3EFE4; padding:18px 22px;
    border-radius:14px 14px 0 0; position:relative;
  }
  .modal-head h3{ font-family:'Noto Serif KR', serif; margin:0 0 2px; font-size:18px; }
  .modal-head p{ margin:0; font-size:13px; color:#C9E4DF; }
  .modal-close{
    position:absolute; top:14px; right:16px; background:none; border:none;
    color:#C9E4DF; font-size:22px; cursor:pointer; line-height:1;
  }
  .modal-body{ padding:20px 22px 24px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13.5px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .field input[type="text"], .field textarea{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--paper);
  }
  .field textarea{ resize:vertical; min-height:88px; }
  .stars{ display:flex; gap:4px; }
  .stars button{
    background:none; border:none; font-size:30px; cursor:pointer; padding:0;
    color:#D8D0BC; line-height:1; transition:color .1s;
  }
  .stars button.on{ color:#E8A72C; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; padding:12px; border-radius:9px; font-size:14.5px; font-weight:700;
    font-family:inherit; cursor:pointer; border:1.5px solid transparent;
  }
  .btn-submit{ background:var(--teal); color:#fff; }
  .btn-submit:hover{ background:var(--teal-deep); }
  .btn-submit:disabled{ opacity:.5; cursor:default; }
  .btn-cancel{ background:#fff; color:var(--ink-soft); border-color:var(--line); }
  .modal-msg{ font-size:13.5px; margin-top:12px; text-align:center; min-height:20px; }
  .modal-msg.ok{ color:var(--teal); }
  .modal-msg.err{ color:var(--danger); }
  .modal-note{
    background:var(--paper); border:1px dashed var(--line); border-radius:8px;
    padding:10px 12px; font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.6;
  }

  .no-results{
    text-align:center;
    padding:40px 10px;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  /* Leaflet popup styling */
  .leaflet-popup-content-wrapper{ border-radius:10px; }
  .popup-name{ font-family:'Noto Serif KR', serif; font-weight:700; font-size:14px; margin:0 0 4px;}
  .popup-addr{ font-size:12px; color:var(--ink-soft); margin:0 0 8px;}
  .popup-actions{ display:flex; gap:6px; }
  .popup-actions a{
    font-size:11.5px; font-weight:700; padding:6px 8px; border-radius:6px; text-decoration:none;
  }

  /* custom marker */
  .pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;
    background:var(--teal);
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 2px 5px rgba(0,0,0,.35);
  }
  .pin.pb{ background:var(--ochre); }
  /* 우편번호 기준 대략 위치 — 정밀 좌표 확보 전 */
  .pin.approx{
    border-radius:50%;
    transform:none;
    background:transparent;
    border:3px dashed var(--teal);
    opacity:.75;
    width:20px;height:20px;
    box-shadow:none;
  }
  .pin.approx.pb{ border-color:var(--ochre); background:transparent; }

  .btn-export{
    padding:8px 14px;
    border:1.5px solid var(--teal);
    background:var(--teal);
    color:#fff;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-export:hover{ background:var(--teal-deep); }
  .btn-export:disabled{ opacity:.4; cursor:default; }

  .guide-link{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--ochre); color:#fff; text-decoration:none;
    font-weight:700; font-size:13.5px; padding:8px 14px; border-radius:8px;
    white-space:nowrap;
  }
  .guide-link:hover{ background:#B0741F; }

  /* scrollbar */
  .list-pane::-webkit-scrollbar{ width:8px; }
  .list-pane::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  @media (max-width:760px){
    .main{ flex-direction:column; }
    .list-pane{ width:100%; max-width:100%; height:46%; order:2; }
    .map-pane{ height:54%; order:1; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div>
        <div class="eyebrow">Orange County · Office on Aging 자료 기반</div>
        <h1>시니어 아파트 지도</h1>
      </div>
    </div>
    <div class="stats">
      <div><b id="statTotal">0</b> 개 단지</div>
      <div><b id="statCities">0</b> 개 도시</div>
      <div><b id="statUnits">0</b> 세대</div>
      <a class="guide-link" href="guide.html">📋 신청 안내 보기</a>
    </div>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="🔍 이름, 주소, 도시로 검색...">
    <select id="cityFilter"><option value="">전체 도시</option></select>
    <select id="ageFilter">
      <option value="">전체 입주연령</option>
      <option value="50+">50+</option>
      <option value="55+">55+</option>
      <option value="60+">60+</option>
      <option value="62+">62+</option>
      <option value="65+">65+</option>
    </select>
    <select id="sortSelect">
      <option value="name">이름순</option>
      <option value="city">도시순</option>
      <option value="units_desc">세대수 많은순</option>
      <option value="units_asc">세대수 적은순</option>
    </select>
    <label class="toggle-chip" id="pbToggle">
      <input type="checkbox" id="pbCheckbox"> 저소득 전용(Project-Based)만
    </label>
  </div>

  <div class="geo-progress show" id="geoProgress">
    <span id="geoText">위치 정밀도를 높이는 중...</span>
    <div class="geo-bar-track"><div class="geo-bar-fill" id="geoBarFill"></div></div>
    <button class="btn-export" id="exportBtn" title="지금까지 확보한 정확한 좌표를 파일에 넣어 저장합니다. 팀원에게 보내면 바로 정확한 지도가 뜹니다.">📍 좌표 저장본 내려받기</button>
  </div>

  <div class="main">
    <div class="list-pane" id="listPane">
      <div class="result-count" id="resultCount"></div>
      <div id="cardContainer"></div>
    </div>
    <div class="map-pane">
      <div id="map"></div>
    </div>
  </div>
</div>

<!-- 후기 작성 모달 -->
<div class="modal-backdrop" id="reviewModal" onclick="if(event.target===this) closeReview()">
  <div class="modal">
    <div class="modal-head">
      <button class="modal-close" onclick="closeReview()" aria-label="닫기">&times;</button>
      <h3 id="rvAptName">후기 남기기</h3>
      <p>실거주 경험을 짧게 남겨주세요</p>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>별점</label>
        <div class="stars" id="rvStars">
          <button type="button" data-v="1">★</button>
          <button type="button" data-v="2">★</button>
          <button type="button" data-v="3">★</button>
          <button type="button" data-v="4">★</button>
          <button type="button" data-v="5">★</button>
        </div>
      </div>
      <div class="field">
        <label for="rvText">후기 내용</label>
        <textarea id="rvText" maxlength="1000" placeholder="관리 상태, 교통, 이웃 분위기 등 실제 경험을 적어주세요."></textarea>
      </div>
      <div class="field">
        <label for="rvNick">닉네임 (선택)</label>
        <input type="text" id="rvNick" maxlength="40" placeholder="비워두면 '익명'으로 표시됩니다">
      </div>
      <!-- 스팸 방지용 숨김 필드 (사람에게는 안 보임) -->
      <input type="text" id="rvHp" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeReview()">취소</button>
        <button class="btn-submit" id="rvSubmit" onclick="submitReview()">등록</button>
      </div>
      <div class="modal-msg" id="rvMsg"></div>
      <div class="modal-note">
        · 등록한 후기는 <b>확인 후 게시</b>되므로 바로 보이지 않을 수 있습니다.<br>
        · 후기는 작성자 개인의 의견이며 본 사이트의 입장이 아닙니다. 사실과 다르거나 부적절한 내용은 게시되지 않습니다.
      </div>
    </div>
  </div>
</div>

/* 주소 단위 정밀 좌표 — "좌표 저장본 내려받기"로 이 자리에 채워집니다 */
/* __PRECISE_START__ */
const BAKED_PRECISE = {};
/* __PRECISE_END__ */

const CACHE_KEY = 'geocode-cache-v1';
let geoCache = Object.assign({}, BAKED_PRECISE); // fullAddress -> {lat, lon}
let markers = {};  // id -> leaflet marker
let selectedId = null;
let map, cluster;
let renderTimer = null;

/* ============================================================
   실거주자 후기 설정
   ↓ 아래 따옴표 안에 Apps Script 웹 앱 URL(.../exec)을 붙여넣으세요.
   비워두면 후기 기능은 조용히 숨겨지고 지도는 그대로 동작합니다.
   ============================================================ */
const REVIEW_API = "";

let reviewsByApt = {}; // aptId -> { avg, count }
let mapReady = false;  // 지도 라이브러리 로드 성공 여부

function initMap(){
  if(typeof L === 'undefined'){
    // 지도 라이브러리 로드 실패(네트워크/CDN 차단 등) — 목록은 정상 동작시킴
    const el = document.getElementById('map');
    if(el){
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.padding = '20px';
      el.style.textAlign = 'center';
      el.style.color = 'var(--ink-soft)';
      el.innerHTML = '지도를 불러오지 못했습니다.<br>인터넷 연결을 확인해주세요.<br>목록과 검색은 정상적으로 사용할 수 있습니다.';
    }
    return;
  }
  map = L.map('map', {zoomControl:true}).setView([33.75, -117.85], 10.2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);
  cluster = L.markerClusterGroup({
    maxClusterRadius:42,
    iconCreateFunction: function(c){
      return L.divIcon({
        html: '<div style="background:#0F4A44;color:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);">'+c.getChildCount()+'</div>',
        className:'', iconSize:[36,36]
      });
    }
  });
  map.addLayer(cluster);
  mapReady = true;
}

function pinIcon(pb, approx){
  return L.divIcon({
    className:'',
    html:'<div class="pin'+(pb?' pb':'')+(approx?' approx':'')+'"></div>',
    iconSize: approx ? [20,20] : [26,26],
    iconAnchor: approx ? [10,10] : [13,26],
    popupAnchor: approx ? [0,-12] : [0,-24]
  });
}

/* 정밀 좌표가 있으면 그것을, 없으면 우편번호 중심을 사용 */
function locate(apt){
  const p = geoCache[apt.fullAddress];
  if(p) return { lat:p.lat, lon:p.lon, approx:false };
  const z = ZIP_CENTROIDS[apt.zip];
  if(z) return { lat:z[0], lon:z[1], approx:true };
  return null;
}

function callHref(phone){
  return 'tel:' + phone.replace(/[^\d+]/g,'');
}
function webHref(site){
  if(!site) return null;
  return site.startsWith('http') ? site : 'https://' + site;
}
function dirHref(addr){
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr);
}

function actionsHtml(apt, size){
  const web = webHref(apt.website);
  const mailHtml = apt.email ? `<a class="btn btn-mail" href="mailto:${apt.email}" onclick="event.stopPropagation()">✉ 이메일</a>` : '';
  return `
    <a class="btn btn-call" href="${callHref(apt.phone)}" onclick="event.stopPropagation()">📞 전화</a>
    <a class="btn btn-dir" href="${dirHref(apt.fullAddress)}" target="_blank" onclick="event.stopPropagation()">🧭 길찾기</a>
    ${web ? `<a class="btn btn-web" href="${web}" target="_blank" onclick="event.stopPropagation()">🔗 웹사이트</a>` : ''}
    ${mailHtml}
  `;
}

/* 별점 평균 + 개수 배지 (승인된 후기가 있을 때만) */
function ratingBadge(aptId){
  const r = reviewsByApt[aptId];
  if(!r || !r.count) return '';
  return `<span class="badge badge-rating">★ ${r.avg.toFixed(1)} <small>(${r.count})</small></span>`;
}

/* 후기 남기기 버튼 (API가 설정된 경우에만 노출) */
function reviewBtn(apt){
  if(!REVIEW_API) return '';
  return `<a class="btn btn-review" href="#" onclick="event.stopPropagation(); openReview(${apt.id}); return false;">✍ 후기 남기기</a>`;
}

function cardHtml(apt){
  return `
  <div class="card" id="card-${apt.id}" onclick="selectApartment(${apt.id})">
    <div class="card-top">
      <h3 class="card-name">${apt.name}</h3>
    </div>
    <p class="card-addr">${apt.address}, ${apt.city} ${apt.zip}</p>
    <div class="badges">
      <span class="badge badge-age">${apt.age}</span>
      ${apt.projectBased ? '<span class="badge badge-pb">저소득 전용**</span>' : ''}
      <span class="badge badge-units">${apt.units}세대</span>
      ${ratingBadge(apt.id)}
    </div>
    <div class="card-actions">${actionsHtml(apt)}${reviewBtn(apt)}</div>
  </div>`;
}

function popupHtml(apt, approx){
  return `
    <div class="popup-name">${apt.name}</div>
    <div class="popup-addr">${apt.address}, ${apt.city} ${apt.zip}<br>${apt.age}${apt.projectBased ? ' · 저소득 전용**' : ''} · ${apt.units}세대${reviewsByApt[apt.id] && reviewsByApt[apt.id].count ? ' · ★ ' + reviewsByApt[apt.id].avg.toFixed(1) + ' (' + reviewsByApt[apt.id].count + ')' : ''}${approx ? '<br><span style="color:#B4472F;">※ 우편번호 기준 대략 위치 — 정확한 위치는 길찾기로 확인</span>' : ''}</div>
    <div class="popup-actions">${actionsHtml(apt)}${reviewBtn(apt)}</div>
  `;
}

function populateCityFilter(){
  const cities = [...new Set(APARTMENTS.map(a=>a.city))].sort((a,b)=>a.localeCompare(b,'ko'));
  const sel = document.getElementById('cityFilter');
  cities.forEach(c=>{
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
}

function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const city = document.getElementById('cityFilter').value;
  const age = document.getElementById('ageFilter').value;
  const pbOnly = document.getElementById('pbCheckbox').checked;
  const sortBy = document.getElementById('sortSelect').value;

  let list = APARTMENTS.filter(a=>{
    if(city && a.city !== city) return false;
    if(age && a.age !== age) return false;
    if(pbOnly && !a.projectBased) return false;
    if(q){
      const hay = (a.name+' '+a.address+' '+a.city+' '+a.zip).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  if(sortBy === 'name') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortBy === 'city') list.sort((a,b)=>a.city.localeCompare(b.city,'ko') || a.name.localeCompare(b.name));
  else if(sortBy === 'units_desc') list.sort((a,b)=>b.units - a.units);
  else if(sortBy === 'units_asc') list.sort((a,b)=>a.units - b.units);

  return list;
}

function renderList(){
  const list = getFiltered();
  const container = document.getElementById('cardContainer');
  document.getElementById('resultCount').textContent = `${list.length}개 결과 표시 중 (전체 ${APARTMENTS.length}개)`;
  if(list.length === 0){
    container.innerHTML = '<div class="no-results">조건에 맞는 아파트가 없습니다.<br>검색어나 필터를 조정해보세요.</div>';
    return;
  }
  container.innerHTML = list.map(cardHtml).join('');
}

function renderMap(){
  if(!mapReady) return;   // 지도 없으면 목록만 사용
  cluster.clearLayers();
  markers = {};
  const list = getFiltered();
  list.forEach(apt=>{
    const geo = locate(apt);
    if(!geo) return;
    const m = L.marker([geo.lat, geo.lon], {icon: pinIcon(apt.projectBased, geo.approx)});
    m.bindPopup(popupHtml(apt, geo.approx));
    m.on('click', ()=> highlightCard(apt.id));
    markers[apt.id] = m;
    cluster.addLayer(m);
  });
}

/* 지오코딩 중 지도를 매번 새로 그리면 버벅이므로 묶어서 처리 */
function renderMapThrottled(){
  if(renderTimer) return;
  renderTimer = setTimeout(()=>{ renderTimer = null; renderMap(); }, 700);
}

function highlightCard(id){
  document.querySelectorAll('.card.selected').forEach(c=>c.classList.remove('selected'));
  const el = document.getElementById('card-'+id);
  if(el){
    el.classList.add('selected');
    el.scrollIntoView({behavior:'smooth', block:'center'});
  }
  selectedId = id;
}

function selectApartment(id){
  const apt = APARTMENTS.find(a=>a.id===id);
  if(!apt) return;
  highlightCard(id);
  if(!mapReady) return;   // 지도 없으면 카드 선택까지만
  const geo = geoCache[apt.fullAddress];
  if(geo){
    map.flyTo([geo.lat, geo.lon], 15, {duration:0.6});
    const m = markers[id];
    if(m){
      setTimeout(()=>{ cluster.zoomToShowLayer(m, ()=> m.openPopup()); }, 300);
    }
  }
}

function refreshAll(){
  renderList();
  renderMap();
}

['searchInput','cityFilter','ageFilter','sortSelect'].forEach(id=>{
  document.getElementById(id).addEventListener('input', refreshAll);
  document.getElementById(id).addEventListener('change', refreshAll);
});
document.getElementById('pbCheckbox').addEventListener('change', function(){
  document.getElementById('pbToggle').classList.toggle('active', this.checked);
  refreshAll();
});

function updateStats(){
  document.getElementById('statTotal').textContent = APARTMENTS.length;
  document.getElementById('statCities').textContent = new Set(APARTMENTS.map(a=>a.city)).size;
  document.getElementById('statUnits').textContent = APARTMENTS.reduce((s,a)=>s+a.units,0).toLocaleString();
}

/* ---------------- 위치 정밀화 (백그라운드) ----------------
   전략:
   1) 우편번호 중심 좌표로 143곳을 즉시 표시 (대기 시간 0초)
   2) 그 뒤 백그라운드에서 주소 단위 정확한 좌표를 조회해 핀을 교체
   3) 화면에 보이는(필터된) 항목을 먼저 처리 → 체감 속도 개선
   4) 결과는 브라우저에 저장 + 파일로 구워서 팀 배포 가능
------------------------------------------------------------ */
async function loadCache(){
  try{
    const res = await window.storage.get(CACHE_KEY, false);
    if(res && res.value){ geoCache = Object.assign({}, BAKED_PRECISE, JSON.parse(res.value)); }
  }catch(e){ /* 저장소 미사용 환경이면 내장 좌표만 사용 */ }
}
async function saveCache(){
  try{ await window.storage.set(CACHE_KEY, JSON.stringify(geoCache), false); }catch(e){}
}

/* 구조화 질의가 자유형 질의보다 정확도가 높음 */
async function geocodeOne(apt){
  const params = new URLSearchParams({
    format:'json', limit:'1', countrycodes:'us',
    street: apt.address, city: apt.city, state:'CA', postalcode: apt.zip
  });
  const resp = await fetch('https://nominatim.openstreetmap.org/search?' + params, {
    headers:{ 'Accept-Language':'en' }
  });
  if(resp.status === 429) throw new Error('rate');
  const arr = await resp.json();
  if(arr && arr.length) return { lat: parseFloat(arr[0].lat), lon: parseFloat(arr[0].lon) };
  return null;
}

function updateProgress(){
  const total = APARTMENTS.length;
  const done = APARTMENTS.filter(a => geoCache[a.fullAddress]).length;
  document.getElementById('geoBarFill').style.width = Math.round(done/total*100) + '%';
  const text = document.getElementById('geoText');
  if(done >= total){
    text.textContent = '\u2713 ' + total + '\uacf3 \ubaa8\ub450 \uc815\ud655\ud55c \uc704\uce58\ub85c \ud45c\uc2dc\ub428';
    document.getElementById('geoProgress').style.background = '#EAF5F2';
  }else{
    text.textContent = '\uc704\uce58 \uc815\ubc00\ub3c4\ub97c \ub192\uc774\ub294 \uc911 ' + done + '/' + total
      + ' \u2014 \uc9c0\ub3c4\ub294 \uc9c0\uae08 \ubc14\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4';
  }
}

/* 현재 필터에 걸린 항목을 앞으로 당겨 정렬 */
function buildQueue(){
  const visible = new Set(getFiltered().map(a=>a.id));
  const pending = APARTMENTS.filter(a => !geoCache[a.fullAddress]);
  return pending.sort((a,b)=>(visible.has(b.id)?1:0)-(visible.has(a.id)?1:0));
}

let refining = false;
async function refineLocations(){
  if(refining || !mapReady) return;   // 지도 없으면 위치 보정 생략
  refining = true;
  updateProgress();

  let delay = 1100;   // Nominatim 공개 서버는 초당 1회 제한
  let saveTick = 0;

  while(true){
    const queue = buildQueue();
    if(queue.length === 0) break;
    const apt = queue[0];
    try{
      const geo = await geocodeOne(apt);
      if(geo){
        geoCache[apt.fullAddress] = geo;
      }else if(ZIP_CENTROIDS[apt.zip]){
        // 주소를 못 찾으면 우편번호 좌표로 확정해 무한 재시도를 막음
        geoCache[apt.fullAddress] = { lat: ZIP_CENTROIDS[apt.zip][0], lon: ZIP_CENTROIDS[apt.zip][1] };
      }else{
        break;
      }
      delay = 1100;
    }catch(e){
      delay = Math.min(delay * 2, 8000);   // 제한에 걸리면 간격을 늘려 재시도
      await new Promise(r=>setTimeout(r, delay));
      continue;
    }
    updateProgress();
    renderMapThrottled();
    if(++saveTick % 10 === 0) await saveCache();
    await new Promise(r=>setTimeout(r, delay));
  }

  await saveCache();
  renderMap();
  updateProgress();
  refining = false;
}

/* 확보한 좌표를 파일에 구워서 저장 — 팀원에게 보내면 즉시 정확한 지도 */
document.getElementById('exportBtn').addEventListener('click', function(){
  const html = document.documentElement.outerHTML;
  const marker = /\/\* __PRECISE_START__ \*\/[\s\S]*?\/\* __PRECISE_END__ \*\//;
  const baked = '/* __PRECISE_START__ */\nconst BAKED_PRECISE = '
              + JSON.stringify(geoCache) + ';\n/* __PRECISE_END__ */';
  const out = '<!DOCTYPE html>\n' + html.replace(marker, baked);
  const blob = new Blob([out], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'senior_apartments_map_geocoded.html';
  a.click();
  URL.revokeObjectURL(a.href);
});

/* 승인된 후기를 불러와 단지별 평균·개수로 집계 */
async function loadReviews(){
  if(!REVIEW_API) return;                 // 미설정이면 후기 기능 비활성
  try{
    const res = await fetch(REVIEW_API);
    const list = await res.json();
    const agg = {};
    list.forEach(r=>{
      const id = parseInt(r.apartmentId, 10);
      const rating = parseFloat(r.rating);
      if(!id || !rating) return;
      if(!agg[id]) agg[id] = { sum:0, count:0 };
      agg[id].sum += rating;
      agg[id].count += 1;
    });
    reviewsByApt = {};
    Object.keys(agg).forEach(id=>{
      reviewsByApt[id] = { avg: agg[id].sum / agg[id].count, count: agg[id].count };
    });
    renderList();
    renderMap();
  }catch(e){ /* 후기 로딩 실패 시 지도는 그대로 동작 */ }
}

let rvAptId = null;
let rvRating = 0;

function openReview(aptId){
  const apt = APARTMENTS.find(a=>a.id===aptId);
  if(!apt) return;
  rvAptId = aptId;
  rvRating = 0;
  document.getElementById('rvAptName').textContent = apt.name + ' 후기 남기기';
  document.getElementById('rvText').value = '';
  document.getElementById('rvNick').value = '';
  document.getElementById('rvHp').value = '';
  document.getElementById('rvMsg').textContent = '';
  document.getElementById('rvMsg').className = 'modal-msg';
  document.getElementById('rvSubmit').disabled = false;
  paintStars(0);
  document.getElementById('reviewModal').classList.add('show');
}

function closeReview(){
  document.getElementById('reviewModal').classList.remove('show');
}

function paintStars(v){
  document.querySelectorAll('#rvStars button').forEach(b=>{
    b.classList.toggle('on', parseInt(b.dataset.v,10) <= v);
  });
}

document.querySelectorAll('#rvStars button').forEach(b=>{
  b.addEventListener('click', ()=>{ rvRating = parseInt(b.dataset.v,10); paintStars(rvRating); });
});

async function submitReview(){
  const msg = document.getElementById('rvMsg');
  const text = document.getElementById('rvText').value.trim();
  if(!rvRating){ msg.className='modal-msg err'; msg.textContent='별점을 선택해주세요.'; return; }
  if(!text){ msg.className='modal-msg err'; msg.textContent='후기 내용을 입력해주세요.'; return; }

  const btn = document.getElementById('rvSubmit');
  btn.disabled = true;
  msg.className='modal-msg'; msg.textContent='등록 중...';

  const payload = {
    apartmentId: rvAptId,
    rating: rvRating,
    text: text,
    nickname: document.getElementById('rvNick').value.trim(),
    website: document.getElementById('rvHp').value   // honeypot
  };

  try{
    // Content-Type을 text/plain으로 보내 Apps Script의 CORS preflight를 피함
    const res = await fetch(REVIEW_API, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if(out && out.ok){
      msg.className='modal-msg ok';
      msg.textContent='등록되었습니다. 확인 후 게시됩니다. 감사합니다!';
      setTimeout(closeReview, 1800);
    }else{
      msg.className='modal-msg err';
      msg.textContent = (out && out.error) ? out.error : '등록에 실패했습니다. 잠시 후 다시 시도해주세요.';
      btn.disabled = false;
    }
  }catch(e){
    msg.className='modal-msg err';
    msg.textContent='등록에 실패했습니다. 인터넷 연결을 확인해주세요.';
    btn.disabled = false;
  }
}

(async function init(){
  populateCityFilter();
  updateStats();
  renderList();         // 목록 먼저 — 지도 로드와 무관하게 항상 표시
  initMap();
  if(!mapReady){        // 지도 없으면 진행바 숨김
    document.getElementById('geoProgress').style.display = 'none';
  }
  renderMap();          // 우편번호 좌표로 즉시 표시 (대기 없음)
  await loadCache();
  renderMap();          // 저장된 정밀 좌표 반영
  updateProgress();
  loadReviews();        // 승인된 후기 불러와 카드에 별점 표시
  refineLocations();    // 나머지는 백그라운드 보정
})();
