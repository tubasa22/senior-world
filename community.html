<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 | 시니어 나침반</title>
  <meta name="description" content="시니어 나침반 공지와 시니어 정책 뉴스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F7F9FB;--ink:#22303A;--ink-soft:#5C7080;--teal:#2D6FA3;--teal-deep:#1B4A70;--ochre:#E8873D;--line:#DCE4E8;--card:#fff;--news:#7B5CA7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.75}header,footer{padding:40px 24px;background:var(--teal-deep);color:#fff}.header-inner,.wrap,.footer-inner{width:min(920px,100%);margin:auto}.eyebrow{margin:0 0 7px;color:#CFE3F2;font-size:13px;font-weight:700;letter-spacing:2px}h1,h2{font-family:'Noto Serif KR',serif;line-height:1.4}h1{margin:0 0 8px;font-size:clamp(34px,5vw,48px)}.sub{margin:0;color:#E7F0F6;font-size:17px}.nav,.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.nav a,.tabs button{padding:8px 13px;border:1px solid rgba(255,255,255,.45);border-radius:8px;color:#fff;background:transparent;font:700 14px inherit;text-decoration:none}.nav a.primary,.tabs button.active{border-color:var(--ochre);background:var(--ochre)}.wrap{padding:40px 24px 70px}.tabs{margin:0 0 18px}.tabs button{border-color:var(--teal);color:var(--teal);cursor:pointer}.status{margin:0 0 17px;color:var(--ink-soft);font-size:14px}.posts{display:grid;gap:16px}.post{padding:25px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 8px 22px rgba(27,74,112,.06)}.post h2{margin:10px 0 0;color:var(--teal-deep);font-size:25px}.date,.source{margin:5px 0 16px;color:var(--ink-soft);font-size:14px}.body{margin:0;white-space:pre-wrap}.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:#E2F0FA;color:var(--teal-deep);font-weight:800;font-size:13px}.badge.news{background:#EEE7F7;color:var(--news)}.source.warning{color:#A33;font-weight:700}.post-footer{display:flex;justify-content:flex-end;margin-top:20px}.like-btn{padding:9px 13px;border:1px solid var(--teal);border-radius:8px;background:#fff;color:var(--teal);font:800 14px inherit;cursor:pointer}.like-btn.liked{border-color:var(--ochre);background:var(--ochre);color:#fff}.empty{padding:42px;border:1px dashed var(--line);border-radius:14px;color:var(--ink-soft);text-align:center}.brand{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700}@media(max-width:600px){header{padding:32px 20px}.wrap{padding:32px 20px}.post{padding:20px}.post h2{font-size:22px}}
  </style>
</head>
<body>
<header><div class="header-inner"><p class="eyebrow">시니어 나침반 · 커뮤니티</p><h1>커뮤니티</h1><p class="sub">시니어 나침반 소식과 공지사항을 전해드립니다</p>
<nav class="nav" aria-label="커뮤니티 메뉴"><a href="index.html">🏠 홈으로 가기</a><a class="primary" href="community.html">🗞 커뮤니티</a><span data-auth-ui></span></nav></div></header>
<main class="wrap"><div class="tabs" role="tablist" aria-label="게시글 유형"><button class="active" data-filter="전체">전체</button><button data-filter="공지">공지</button><button data-filter="뉴스">뉴스</button></div><p class="status" id="status" aria-live="polite">소식을 불러오는 중입니다.</p><section class="posts" id="posts"></section></main>
<footer><div class="footer-inner"><div class="brand">시니어 나침반</div></div></footer>
<script type="module">
import { requireMemberOrRedirect, getIdToken } from './assets/auth.js';
const COMMUNITY_API = ''; // Apps Script 웹 앱 배포 후 /exec URL 입력
const posts = document.getElementById('posts'), status = document.getElementById('status');
let allPosts = [], filter = '전체';
const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const formatDate = value => { const date = new Date(value); return Number.isNaN(date.getTime()) ? '날짜 확인 필요' : date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}); };
function postHtml(post){const type=post.postType==='뉴스'?'뉴스':'공지';const source=type==='뉴스'?(post.sourceName&&post.sourceUrl?`<p class="source">출처: ${escape(post.sourceName)} · <a href="${escape(post.sourceUrl)}" target="_blank" rel="noopener">원문 보기</a></p>`:'<p class="source warning">출처 정보 확인 필요 — 관리자가 출처명과 원문 링크를 입력해주세요.</p>'):'';return `<article class="post" data-id="${escape(post.id)}"><span class="badge ${type==='뉴스'?'news':''}">${type}</span><h2>${escape(post.title)}</h2><p class="date">${escape(formatDate(post.postedAt))}</p><p class="body">${escape(post.body)}</p>${source}<div class="post-footer"><button class="like-btn" type="button" data-like="${escape(post.id)}">♡ 좋아요 <span>${Number(post.likeCount)||0}</span></button></div></article>`;}
function render(){const list=filter==='전체'?allPosts:allPosts.filter(post=>(post.postType==='뉴스'?'뉴스':'공지')===filter);posts.innerHTML=list.length?list.map(postHtml).join(''):'<div class="empty">아직 등록된 소식이 없습니다</div>';}
async function loadPosts(){if(!COMMUNITY_API){status.textContent='커뮤니티 소식은 준비 중입니다.';allPosts=[];render();return;}try{const response=await fetch(COMMUNITY_API);if(!response.ok)throw new Error('load');allPosts=await response.json();status.textContent=`소식 ${allPosts.length}건`;render();}catch(_){status.textContent='소식을 불러오지 못했습니다.';posts.innerHTML='<div class="empty">잠시 후 다시 확인해주세요.</div>';}}
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));render();}));
posts.addEventListener('click',async event=>{const button=event.target.closest('[data-like]');if(!button)return;if(!await requireMemberOrRedirect(location.href))return;if(!COMMUNITY_API){alert('좋아요 기능이 아직 준비 중입니다');return;}button.disabled=true;try{const response=await fetch(COMMUNITY_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:await getIdToken(),postId:button.dataset.like,action:'like'})});const result=await response.json();if(!result.ok)throw new Error(result.error);button.classList.toggle('liked',result.liked);button.innerHTML=`${result.liked?'♥ 좋아요 취소':'♡ 좋아요'} <span>${Number(result.likeCount)||0}</span>`;}catch(error){alert(error.message||'좋아요 처리에 실패했습니다.');}finally{button.disabled=false;}});
loadPosts();
</script>
</body></html>
