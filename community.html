<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>커뮤니티 | 시니어 나침반</title>
  <meta name="description" content="시니어 나침반 공지와 시니어 정책 뉴스">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site-nav.css">
  <style>
    :root{--paper:#F7F9FB;--ink:#22303A;--ink-soft:#5C7080;--teal:#2D6FA3;--teal-deep:#1B4A70;--ochre:#E8873D;--line:#DCE4E8;--card:#fff;--news:#7B5CA7;--danger:#C0392B}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans KR',sans-serif;line-height:1.75}.header-inner,.wrap,.footer-inner{width:min(920px,100%);margin:auto}.eyebrow{margin:0 0 7px;color:#CFE3F2;font-size:13px;font-weight:700;letter-spacing:2px}h1,h2{font-family:'Noto Serif KR',serif;line-height:1.4}h1{margin:0 0 8px;font-size:clamp(34px,5vw,48px)}.sub{margin:0;color:#E7F0F6;font-size:17px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.tabs button{padding:8px 13px;border:1px solid var(--teal);border-radius:8px;color:var(--teal);background:transparent;font:700 14px inherit;cursor:pointer}.tabs button.active{border-color:var(--ochre);background:var(--ochre);color:#fff}.wrap{padding:40px 24px 70px}.status{margin:0 0 17px;color:var(--ink-soft);font-size:14px}.posts{display:grid;gap:16px}.post,.compose-card{padding:25px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:0 8px 22px rgba(27,74,112,.06)}.post h2,.compose-card h2{margin:10px 0 0;color:var(--teal-deep);font-size:25px}.date,.source{margin:5px 0 16px;color:var(--ink-soft);font-size:14px}.body{margin:0;white-space:pre-wrap}.badge{display:inline-block;padding:3px 9px;border-radius:99px;background:#E2F0FA;color:var(--teal-deep);font-weight:800;font-size:13px}.badge.news{background:#EEE7F7;color:var(--news)}.source.warning{color:#A33;font-weight:700}.post-footer{display:flex;justify-content:flex-end;margin-top:20px}.like-btn{padding:9px 13px;border:1px solid var(--teal);border-radius:8px;background:#fff;color:var(--teal);font:800 14px inherit;cursor:pointer}.like-btn.liked{border-color:var(--ochre);background:var(--ochre);color:#fff}.empty{padding:42px;border:1px dashed var(--line);border-radius:14px;color:var(--ink-soft);text-align:center}.post-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0}.post-photos img{width:100%;height:140px;object-fit:cover;border-radius:8px}.post-video{position:relative;height:0;padding-top:56.25%;margin:14px 0;border-radius:8px;overflow:hidden;background:#000}.post-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.brand{font-family:'Noto Serif KR',serif;font-size:19px;font-weight:700}#composePanel[hidden],#listPanel[hidden]{display:none}.compose-card h2{margin:0 0 8px}.compose-note{margin:0 0 18px;color:var(--ink-soft)}label{display:block;margin-top:14px;font-weight:800}input,select,textarea{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:130px;resize:vertical}.helper{display:block;margin-top:5px;color:var(--ink-soft);font-size:13px;font-weight:400}.consent{display:flex;gap:8px;align-items:flex-start}.consent input{width:auto;margin-top:7px}.primary{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:var(--ochre);color:#fff;font:800 16px inherit;cursor:pointer}.primary:disabled{opacity:.65;cursor:wait}.form-message{min-height:25px;margin:14px 0 0;color:var(--danger)}.form-message.ok{color:#26724A}.back-link{display:inline-block;margin-top:14px;color:var(--teal);font-weight:800}@media(max-width:600px){.wrap{padding:32px 20px}.post,.compose-card{padding:20px}.post h2,.compose-card h2{font-size:22px}}
  </style>
</head>
<body>
<header class="site-header"><a href="index.html" class="nav-logo"><img src="assets/img/logo.svg" alt="시니어 나침반"></a><nav class="site-nav" aria-label="주요 메뉴"><a href="index.html">홈</a><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">시니어 아파트 ▾</button><div class="nav-dropdown-menu"><a href="map.html">아파트/지도</a><a href="guide.html">신청 안내</a><a href="rhf-application-guide.html">RHF 신청 안내</a></div></div><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">양로시설 ▾</button><div class="nav-dropdown-menu"><a href="ltc-facilities.html">시설 소개</a><a href="ltc-guide.html">종류 검색</a></div></div><a href="ihss-guide.html">IHSS 케어기버</a><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">장례/묘지 ▾</button><div class="nav-dropdown-menu"><a href="funeral-guide.html">장례 정보</a><a href="memorial-parks.html">메모리얼파크 안내</a><a href="cemetery-guide.html">매장권 양도 안내</a><a href="cemetery-board.html">매장권 양도 게시판</a></div></div><a href="benefits-guide.html">생활지원</a><a href="community.html">커뮤니티</a><a href="contact.html">문의하기</a><span id="authStatusSlot" data-auth-ui></span></nav></header>
<section class="page-context"><div class="header-inner"><p class="eyebrow">시니어 나침반 · 커뮤니티</p><h1 id="pageTitle">커뮤니티</h1><p class="sub" id="pageSub">시니어 나침반 소식과 공지사항을 전해드립니다</p></div></section>
<main class="wrap">
  <section id="listPanel"><div class="tabs" role="tablist" aria-label="게시글 유형"><button class="active" data-filter="전체">전체</button><button data-filter="공지">공지</button><button data-filter="뉴스">뉴스</button></div><p class="status" id="status" aria-live="polite">소식을 불러오는 중입니다.</p><section class="posts" id="posts"></section></section>
  <section id="composePanel" hidden aria-live="polite"></section>
</main>
<footer><div class="footer-inner"><div class="brand">시니어 나침반</div></div></footer>
<script type="module">
import { requireMemberOrRedirect, getIdToken, safeReturnUrl } from './assets/auth.js';

const COMMUNITY_API = 'https://script.google.com/macros/s/AKfycbxpFfpCazh15auxmUgqh18bxArDoTqNifHMehkQ8jKqGCOHeoG5uxFdxlk2-e1baZ2K/exec';
// TODO: 각 Apps Script 웹 앱을 배포한 뒤 해당 /exec URL을 입력하세요.
const IHSS_API = 'https://script.google.com/macros/s/AKfycbw9o6nSGRPcjjrgolTvqPVMPZbhbthoejde4l2B09na44-LSAavz-04c4RvxFQsF0GP0A/exec';
const CEMETERY_API = '';
const params = new URLSearchParams(location.search);
const compose = params.get('compose');
const requestedType = params.get('type');
const returnUrl = safeReturnUrl(params.get('return'));
const posts = document.getElementById('posts'), status = document.getElementById('status');
const listPanel = document.getElementById('listPanel'), composePanel = document.getElementById('composePanel');
let allPosts = [], filter = '전체';
const escape = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
const formatDate = value => { const date = new Date(value); return Number.isNaN(date.getTime()) ? '날짜 확인 필요' : date.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}); };
const areaOptions = '<option value="">도시 선택</option><option>Orange County</option><option>Los Angeles</option><option>Anaheim</option><option>Buena Park</option><option>Garden Grove</option><option>Irvine</option><option>Fullerton</option><option>Koreatown</option><option>기타 도시</option>';

function youtubeId(url){const match=String(url||'').match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);return match?match[1]:'';}
function postHtml(post){const type=post.postType==='뉴스'?'뉴스':'공지';const source=type==='뉴스'?(post.sourceName&&post.sourceUrl?`<p class="source">출처: ${escape(post.sourceName)} · <a href="${escape(post.sourceUrl)}" target="_blank" rel="noopener">원문 보기</a></p>`:'<p class="source warning">출처 정보 확인 필요 — 관리자가 출처명과 원문 링크를 입력해주세요.</p>'):'';const photos=Array.isArray(post.photoUrls)?post.photoUrls:[];const photosHtml=photos.length?`<div class="post-photos">${photos.map(url=>`<img src="${escape(url)}" alt="${escape(post.title)} 사진" loading="lazy">`).join('')}</div>`:'';const videoId=youtubeId(post.youtubeUrl);const videoHtml=videoId?`<div class="post-video"><iframe src="https://www.youtube.com/embed/${escape(videoId)}" title="관련 영상" loading="lazy" allow="encrypted-media" allowfullscreen></iframe></div>`:'';return `<article class="post" data-id="${escape(post.id)}"><span class="badge ${type==='뉴스'?'news':''}">${type}</span><h2>${escape(post.title)}</h2><p class="date">${escape(formatDate(post.postedAt))}</p>${photosHtml}${videoHtml}<p class="body">${escape(post.body)}</p>${source}<div class="post-footer"><button class="like-btn" type="button" data-like="${escape(post.id)}">♡ 좋아요 <span>${Number(post.likeCount)||0}</span></button></div></article>`;}
function render(){const list=filter==='전체'?allPosts:allPosts.filter(post=>(post.postType==='뉴스'?'뉴스':'공지')===filter);posts.innerHTML=list.length?list.map(postHtml).join(''):'<div class="empty">아직 등록된 소식이 없습니다</div>';}
async function loadPosts(){if(!COMMUNITY_API){status.textContent='커뮤니티 소식은 준비 중입니다.';allPosts=[];render();return;}try{const response=await fetch(COMMUNITY_API);if(!response.ok)throw new Error('load');const result=await response.json();allPosts=Array.isArray(result)?result:(result.posts||[]);status.textContent=`소식 ${allPosts.length}건`;render();}catch(_){status.textContent='소식을 불러오지 못했습니다.';posts.innerHTML='<div class="empty">잠시 후 다시 확인해주세요.</div>';}}

function ihssForm(type){return `<article class="compose-card"><h2>IHSS 케어기버 글쓰기</h2><p class="compose-note">등록된 글은 관리자 검토 후 게시됩니다. 연락처는 게시글에 공개되므로 본인이 공개해도 되는 정보만 입력하세요.</p><form id="composeForm"><label>유형<select id="type" required><option${type==='구합니다'?' selected':''}>구합니다</option><option${type==='제공합니다'?' selected':''}>제공합니다</option></select></label><label>닉네임 (선택)<input id="nickname" maxlength="40" autocomplete="nickname"><span class="helper">비워두면 “익명”으로 표시됩니다.</span></label><label>지역 (도시 단위만)<select id="area" required>${areaOptions}</select></label><label>연락 방법<select id="contactMethod" required><option>전화</option><option>이메일</option></select></label><label>공개 연락처<input id="contactValue" maxlength="100" required><span class="helper">입력한 연락처는 게시글에 그대로 공개됩니다.</span></label><label>내용<textarea id="content" maxlength="500" required placeholder="원하는 조건, 가능한 시간 등을 적어주세요."></textarea></label><label class="consent"><input id="consent" type="checkbox"><span>이 정보가 게시판에 공개되며, 사이트는 상대방의 신원을 검증하지 않는다는 것에 동의합니다.</span></label><input id="website" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="primary" id="submit" type="submit" disabled>검토 요청 보내기</button><p id="message" class="form-message" aria-live="polite"></p></form></article>`;}
function cemeteryForm(type){return `<article class="compose-card"><h2>매장권 정보 등록</h2><p class="compose-note">등록된 글은 관리자 검토 후 게시됩니다. 증빙 서류는 관리자 검토용으로만 사용되며 공개 게시판에는 표시되지 않습니다.</p><form id="composeForm"><label>유형<select id="type" required><option${type==='양도합니다'?' selected':''}>양도합니다</option><option${type==='구합니다'?' selected':''}>구합니다</option></select></label><label>닉네임 (선택)<input id="nickname" maxlength="40" autocomplete="nickname"><span class="helper">비워두면 “익명”으로 표시됩니다.</span></label><label>묘지 이름<input id="cemeteryName" maxlength="120" required></label><label>지역/도시 (도시 단위만)<select id="area" required>${areaOptions}</select></label><label>구획 정보 (선택)<input id="plotInfo" maxlength="160" placeholder="예: Section 또는 Block 번호"></label><label>희망 가격 (선택)<input id="price" maxlength="60" inputmode="decimal"></label><label>연락 방법<select id="contactMethod" required><option>전화</option><option>이메일</option></select></label><label>공개 연락처<input id="contactValue" maxlength="100" required><span class="helper">입력한 연락처는 공개 게시글에 그대로 표시됩니다.</span></label><label>매장권 증빙 서류<input id="certificate" type="file" accept="image/*,.pdf" required><span class="helper">이미지 또는 PDF, 최대 5MB. 업로드한 서류는 관리자 검토 목적으로만 사용되며 게시판에는 공개되지 않습니다.</span></label><label class="consent"><input id="consent" type="checkbox"><span>이 정보가 게시판에 공개되며, 사이트는 거래를 중개·보증하지 않고 증빙 서류는 관리자 검토 목적으로만 사용됨에 동의합니다.</span></label><input id="website" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" aria-hidden="true"><button class="primary" id="submit" type="submit" disabled>검토 요청 보내기</button><p id="message" class="form-message" aria-live="polite"></p></form></article>`;}
function readCertificate(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(new Error('파일을 읽지 못했습니다.'));reader.readAsDataURL(file);});}
function showSuccess(){composePanel.innerHTML='<article class="compose-card"><h2>등록되었습니다</h2><p class="compose-note">검토 후 게시됩니다.</p></article>';const card=composePanel.firstElementChild;const back=document.createElement('a');back.className='back-link';back.href=returnUrl;back.textContent='게시판으로 돌아가기';card.append(back);}

async function showComposer(){
  const allowed = compose==='ihss' ? ['구합니다','제공합니다'] : ['양도합니다','구합니다'];
  const type = allowed.includes(requestedType) ? requestedType : allowed[0];
  if(!await requireMemberOrRedirect(window.location.href)) return;
  listPanel.hidden=true;composePanel.hidden=false;
  document.getElementById('pageTitle').textContent=compose==='ihss'?'IHSS 케어기버 글쓰기':'매장권 양도 글쓰기';
  document.getElementById('pageSub').textContent='회원 전용 글쓰기입니다. 등록 후 관리자 검토를 거쳐 게시됩니다.';
  composePanel.innerHTML=compose==='ihss'?ihssForm(type):cemeteryForm(type);
  const form=document.getElementById('composeForm'), submit=document.getElementById('submit'), message=document.getElementById('message');
  document.getElementById('consent').addEventListener('change',event=>{submit.disabled=!event.target.checked;});
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(!await requireMemberOrRedirect(window.location.href)) return;
    const api=compose==='ihss'?IHSS_API:CEMETERY_API;
    if(!api){message.textContent='게시판 등록 기능이 아직 준비 중입니다.';return;}
    let payload={idToken:await getIdToken(),type:document.getElementById('type').value,nickname:document.getElementById('nickname').value,area:document.getElementById('area').value,contactMethod:document.getElementById('contactMethod').value,contactValue:document.getElementById('contactValue').value,consent:document.getElementById('consent').checked,website:document.getElementById('website').value};
    if(compose==='ihss'){payload.content=document.getElementById('content').value;}
    else {const file=document.getElementById('certificate').files[0];if(!file||file.size>5*1024*1024){message.textContent='증빙 서류를 선택하고 5MB 이하인지 확인해주세요.';return;}payload={...payload,action:'submitListing',cemeteryName:document.getElementById('cemeteryName').value,plotInfo:document.getElementById('plotInfo').value,price:document.getElementById('price').value,certificateBase64:await readCertificate(file),certificateName:file.name,certificateMime:file.type};}
    submit.disabled=true;submit.textContent=compose==='cemetery'?'업로드 중…':'등록 중…';message.textContent='';message.className='form-message';
    try{const response=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});const result=await response.json();if(!result.ok)throw new Error(result.error||'등록에 실패했습니다.');showSuccess();}catch(error){message.textContent=error.message||'등록에 실패했습니다.';message.className='form-message';submit.disabled=false;submit.textContent='검토 요청 보내기';}
  });
}

document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(item=>item.classList.toggle('active',item===button));render();}));
posts.addEventListener('click',async event=>{const button=event.target.closest('[data-like]');if(!button)return;if(!await requireMemberOrRedirect(location.href))return;if(!COMMUNITY_API){alert('좋아요 기능이 아직 준비 중입니다');return;}button.disabled=true;try{const response=await fetch(COMMUNITY_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({idToken:await getIdToken(),postId:button.dataset.like,action:'like'})});const result=await response.json();if(!result.ok)throw new Error(result.error);button.classList.toggle('liked',result.liked);button.innerHTML=`${result.liked?'♥ 좋아요 취소':'♡ 좋아요'} <span>${Number(result.likeCount)||0}</span>`;}catch(error){alert(error.message||'좋아요 처리에 실패했습니다.');}finally{button.disabled=false;}});
if(compose==='ihss'||compose==='cemetery')showComposer();else loadPosts();
</script>
<script src="assets/site-nav.js"></script>
</body></html>
