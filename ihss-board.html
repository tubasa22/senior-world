<style>:root{--p:#F7F9FB;--i:#22303A;--s:#5C7080;--t:#2D6FA3;--d:#1B4A70;--o:#E8873D;--l:#DCE4E8}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:16px/1.7 system-ui,sans-serif}.wrap{width:min(900px,100%);margin:auto}main{padding:24px}.warning{padding:20px;border-left:6px solid var(--o);background:#FFF1E6;color:#6b3918;font-weight:600}.tabs{display:flex;gap:8px;margin:20px 0}.tab,.write{padding:9px 13px;border:1px solid var(--t);border-radius:8px;background:#fff;color:var(--t);font:inherit;font-weight:bold;cursor:pointer}.tab.active,.write{background:var(--t);color:#fff}.posts{display:grid;gap:14px}.post{padding:20px;border:1px solid var(--l);border-radius:12px;background:#fff}.meta{color:var(--s);font-size:14px}.page-context{padding:28px 24px;background:#EAF0F5}.page-context h1{margin:4px 0 0}.page-context b{color:var(--t)}</style><link rel="stylesheet" href="assets/site-nav.css">
<body>
<header class="site-header"><a href="index.html" class="nav-logo"><img src="assets/img/logo.svg" alt="시니어 나침반"></a><nav class="site-nav" aria-label="주요 메뉴"><a href="index.html">홈</a><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">시니어 아파트 ▾</button><div class="nav-dropdown-menu"><a href="map.html">아파트/지도</a><a href="guide.html">신청 안내</a><a href="rhf-application-guide.html">RHF 신청 안내</a></div></div><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">양로시설 ▾</button><div class="nav-dropdown-menu"><a href="ltc-facilities.html">시설 소개</a><a href="ltc-guide.html">종류 검색</a></div></div><a href="ihss-guide.html">IHSS 케어기버</a><div class="nav-dropdown"><button class="nav-dropdown-btn" aria-expanded="false" aria-haspopup="true">장례/묘지 ▾</button><div class="nav-dropdown-menu"><a href="funeral-guide.html">장례 정보</a><a href="memorial-parks.html">메모리얼파크 안내</a><a href="cemetery-guide.html">매장권 양도 안내</a><a href="cemetery-board.html">매장권 양도 게시판</a></div></div><a href="benefits-guide.html">생활지원</a><a href="community.html">커뮤니티</a><a href="contact.html">문의하기</a><span id="authStatusSlot" data-auth-ui></span></nav></header>
<section class="page-context"><div class="wrap"><b>시니어 나침반 · IHSS 케어기버</b><h1>구합니다 / 제공합니다</h1></div></section>
<main class="wrap">
<div class="warning">⚠️ 이 게시판은 개인 간 정보 교환 공간입니다. 사이트는 게시자의 신원, 경력, 배경조회 여부를 확인하지 않습니다. 연락·면접·채용 여부는 반드시 본인이 직접 확인하시고 판단하시기 바랍니다. 검증된 케어기버를 원하시면 <a href="ihss-guide.html">IHSS 공식 Registry 안내</a>를 먼저 확인해보세요.</div>
<div class="tabs">
<button class="tab active" data-type="구합니다">구합니다</button>
<button class="tab" data-type="제공합니다">제공합니다</button>
<button class="write" id="open">글 올리기</button>
</div>
<p id="status" class="meta">
</p>
<section id="posts" class="posts">
</section>
</main>
<script>const API='';let current='구합니다';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(list){const x=list.filter(p=>p.type===current);$('posts').innerHTML=x.length?x.map(p=>`<article class="post">
<b>${esc(p.nickname||'익명')} · ${esc(p.type)}</b>
<p class="meta">${esc(p.area)} · ${esc(p.contactMethod)}: ${esc(p.contactValue)}</p>
<p style="white-space:pre-wrap">${esc(p.content)}</p>
</article>`).join(''):'<div class="post">아직 등록된 글이 없습니다.</div>'}async function load(){if(!API){$('status').textContent='게시판은 준비 중입니다.';render([]);return}try{const r=await fetch(API);render(await r.json())}catch(_){$('status').textContent='글을 불러오지 못했습니다.'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});$('open').onclick=()=>{location.href='community.html?compose=ihss&type='+encodeURIComponent(current)+'&return='+encodeURIComponent(location.href)};load();</script>
