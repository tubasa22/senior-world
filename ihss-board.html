<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IHSS 구합니다/제공합니다 | 시니어 나침반</title>
<style>:root{--p:#F7F9FB;--i:#22303A;--s:#5C7080;--t:#2D6FA3;--d:#1B4A70;--o:#E8873D;--l:#DCE4E8}*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:16px/1.7 system-ui,sans-serif}header{padding:32px 24px;background:var(--d);color:#fff}.wrap{width:min(900px,100%);margin:auto}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}nav a,button{padding:9px 13px;border-radius:8px;font:inherit;font-weight:bold}nav a{border:1px solid #ffffff88;color:#fff;text-decoration:none}main{padding:24px}.warning{padding:20px;border-left:6px solid var(--o);background:#FFF1E6;color:#6b3918;font-weight:600}.tabs{display:flex;gap:8px;margin:20px 0}.tab,.write{border:1px solid var(--t);background:#fff;color:var(--t);cursor:pointer}.tab.active,.write{background:var(--t);color:#fff}.posts{display:grid;gap:14px}.post{padding:20px;border:1px solid var(--l);border-radius:12px;background:#fff}.meta{color:var(--s);font-size:14px}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:18px}.box{width:min(560px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:14px;background:#fff}label{display:block;margin-top:12px;font-weight:bold}input,select,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:7px;font:inherit}textarea{min-height:110px}.consent{display:flex;gap:8px;align-items:flex-start}.consent input{width:auto;margin-top:7px}.msg{color:#a22;margin-top:10px}</style>
<body>
<header>
<div class="wrap">
<b>시니어 나침반 · IHSS 케어기버</b>
<h1>구합니다 / 제공합니다</h1>
<nav>
<a href="index.html">🏠 홈으로 가기</a>
<a href="ihss-guide.html">IHSS 안내</a>
<a href="ihss-board.html">게시판</a>
</nav>
</div>
</header>
<main class="wrap">
<div class="warning">⚠️ 이 게시판은 개인 간 정보 교환 공간입니다. 사이트는 게시자의 신원, 경력, 배경조회 여부를 확인하지 않습니다. 연락·면접·채용 여부는 반드시 본인이 직접 확인하시고 판단하시기 바랍니다. 검증된 케어기버를 원하시면 <a href="ihss-guide.html">IHSS 공식 Registry 안내</a>를 먼저 확인해보세요.</div>
<div class="tabs">
<button class="tab active" data-type="구합니다">구합니다</button>
<button class="tab" data-type="제공합니다">제공합니다</button>
<button class="write" id="open">글 올리기</button>
</div>
<p id="status" class="meta">
</p>
<section id="posts" class="posts">
</section>
</main>
<div id="modal" class="modal hidden">
<form id="form" class="box">
<h2>게시글 작성</h2>
<label>유형 <select id="type">
<option>구합니다</option>
<option>제공합니다</option>
</select>
</label>
<label>닉네임 (선택)<input id="nickname" maxlength="40">
</label>
<label>지역 (도시 단위만)<select id="area" required>
<option value="">도시 선택</option>
<option>Orange County</option>
<option>Los Angeles</option>
<option>Anaheim</option>
<option>Buena Park</option>
<option>Garden Grove</option>
<option>Irvine</option>
<option>Fullerton</option>
<option>Los Angeles</option>
<option>Koreatown</option>
<option>기타 도시</option>
</select>
</label>
<label>연락 방법 <select id="method">
<option>전화</option>
<option>이메일</option>
</select>
</label>
<label>공개 연락처<input id="contact" required maxlength="100">
<small>입력한 연락처는 게시글에 그대로 공개됩니다.</small>
</label>
<label>내용<textarea id="content" maxlength="500" required placeholder="원하는 조건, 가능한 시간 등을 적어주세요.">
</textarea>
</label>
<label class="consent">
<input id="consent" type="checkbox">
<span>이 정보가 게시판에 공개되며, 사이트는 상대방의 신원을 검증하지 않는다는 것에 동의합니다.</span>
</label>
<button id="submit" disabled>검토 요청 보내기</button> <button type="button" id="close">취소</button>
<p id="msg" class="msg">
</p>
<input id="website" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off">
</form>
</div>
<script>const API='';let current='구합니다';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(list){const x=list.filter(p=>p.type===current);$('posts').innerHTML=x.length?x.map(p=>`<article class="post">
<b>${esc(p.nickname||'익명')} · ${esc(p.type)}</b>
<p class="meta">${esc(p.area)} · ${esc(p.contactMethod)}: ${esc(p.contactValue)}</p>
<p style="white-space:pre-wrap">${esc(p.content)}</p>
</article>`).join(''):'<div class="post">아직 등록된 글이 없습니다.</div>'}async function load(){if(!API){$('status').textContent='게시판은 준비 중입니다.';render([]);return}try{const r=await fetch(API);render(await r.json())}catch(_){$('status').textContent='글을 불러오지 못했습니다.'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));load()});$('open').onclick=()=>{$('modal').classList.remove('hidden');$('type').value=current};$('close').onclick=()=>$('modal').classList.add('hidden');$('consent').onchange=e=>$('submit').disabled=!e.target.checked;$('form').onsubmit=async e=>{e.preventDefault();if(!API){$('msg').textContent='게시판 등록 기능이 아직 준비 중입니다.';return}const b={type:$('type').value,nickname:$('nickname').value,area:$('area').value,contactMethod:$('method').value,contactValue:$('contact').value,content:$('content').value,consent:$('consent').checked,website:$('website').value};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}),o=await r.json();$('msg').textContent=o.ok?'등록되었습니다. 검토 후 게시됩니다.':o.error};load();</script>
</body>
</html>
